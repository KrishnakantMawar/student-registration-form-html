<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT REGISTRATION FORM</title>
    <link rel="shortcut icon" href="https://thumbs.dreamstime.com/b/initial-letter-logo-swoosh-red-blue-ak-to-zk-155780477.jpg" type="image/x-icon">
    <!-- url pr image lagne ke liye link favcon vala element chose karna padta hai -->
</head>
<body>
    <h1>STUDENT REGISTRATION FORM</h1>
    <form >
    <fieldset>
        <legend>PERSONAL INFORMATION</legend>
<label for="name">Name</label>
<input  id="name" type="text" placeholder="ENTER YOUR NAME" required><br><br>
<label for="email">Email</label>
<input  id="email" type="text" placeholder="ENTER YOUR Email" required><br><br>
<label for="number">Phone Number</label>
<input  id="number" type="tel" placeholder="ENTER YOUR  Number" required>
    </fieldset>

    <br>
    <br>
    <fieldset>
        <legend>ADDRESS DETAILS</legend>
        <label for="addressline1">Address line 1</label>
        <textarea  id="addressline1" rows="4" placeholder="enter address"></textarea>
<br>
<br>
        <label for="city">City</label><br>
        <select id="city">
            <option >Mandsaur</option>
            <option >Ujjain</option>
            <option >Indore</option>
            <option >Ratlam</option>
            <option >Bhopal</option>
            <option >Mumbai</option>
        </select>
        <br><br>
         <label for="country">Country</label><br>
        <select id="country">
            <option >INDIA</option>
            <option >AUSTRALIA</option>
            <option >AFRICA</option>
            </select>
    </fieldset>
    <br><br>
    <label for="course">Course</label><br>
    <select  id="course">
        <optgroup label="FRONTEND">
            <option >Html</option>
               <option >css</option>
               <option >Js</option>
                       </optgroup>
                       <optgroup label="BACKEND">
            <option >node.js</option>
               <option >Express js</option>
               <option >mongodb</option>
                       </optgroup>
    </select>
    <br><br>
    <button>SUBMIT form</button>
   
    </form>

        <summary>open me</summary>
        <p>This project is a Student Registration Form created using only HTML5. </p>
     </details>
     <h1 contenteditable="true">comment to add extra code</h1>
     <h1 draggable="true">THANKYOU</h1>
</body>
</html>
